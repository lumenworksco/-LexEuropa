name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: "Install (light, no torch or local models)"
        run: pip install -e ".[dev]"
      - name: Offline tests
        run: python -m pytest tests/ -v -k "not full_hybrid"
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"
      - name: Web page behaviour tests (jsdom)
        if: matrix.python-version == '3.12'
        run: cd tests/ui && npm install --no-audit --no-fund && npm test
      - name: Pages site builds
        if: matrix.python-version == '3.12'
        run: |
          python scripts/build_site.py
          test -s _site/index.html && test -s _site/demo/index.html && test -s _site/demo/info.json
