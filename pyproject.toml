[project]
name = "lexeuropa"
version = "0.9.0"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Florian Braun" }]
keywords = ["rag", "legal", "eu-law", "gdpr", "cjeu", "citation-verification", "lora"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
]
description = "Open-model EU legal research assistant: hybrid retrieval over CELLAR texts, a LoRA-tuned generator and per-claim citation verification."
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "certifi>=2024.0",
]

[project.urls]
Homepage = "https://github.com/lumenworksco/-LexEuropa"
Issues = "https://github.com/lumenworksco/-LexEuropa/issues"
Demo = "https://lumenworksco.github.io/-LexEuropa/"
Models = "https://huggingface.co/iPwnds/lexeuropa-qwen3b-merged-v4"
Changelog = "https://github.com/lumenworksco/-LexEuropa/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Local cross-encoder reranker (pulls in torch, ~3 GB with weights). Optional:
# without it retrieval falls back to the fused BM25+dense+resolver ranking.
rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lexeuropa*"]

[tool.setuptools.package-data]
lexeuropa = ["web_static/*.html"]
